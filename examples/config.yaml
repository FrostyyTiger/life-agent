# Example configuration. The real one lives at $LIFE_AGENT_DATA/config.yaml in the
# private data repo, is owned by you, and is read-only to the agent.

calendar_id: primary
lookahead: 14d

# Applied when a thread omits these. Deliberately conservative: it is better for a new
# thread to surface slightly too early than to be invisible.
defaults:
  patience: 14d
  lead: 7d

brief:
  time: "07:00"
  max_urgent: 3        # hard cap on "Needs you today". Never raise this.
  timezone: Europe/Zurich

# Threads carrying any of these tags are evaluated locally by date arithmetic and appear in
# the brief as a title and a date only. Their bodies are never sent to the model API.
# See docs/egress.md, row 1.
exclude_tags:
  - medical
  - finance

model:
  endpoint: anthropic
  name: claude-sonnet-5

publish:
  remote: origin
  branch: main
  secret_scan: true    # pre-push gitleaks. Do not disable.

# Mail archive + digest (mail-v1, see docs/plans/mail-v1.md). Owned by you, read-only
# to the mail jobs, which run as a separate `life-agent` system user — see
# docs/trust-model.md for why the archive is isolated from everything else here.
mail:
  address: you@example.com
  owner_name: null         # optional; not sent to any model. Purely local (e.g. a leak
                            # test can check the repo never contains your real name)
  tag_since: 2026-01-01   # mail older than this is archived+searchable but never sent to a model
  digest_time: "06:30"
  timezone: Europe/Zurich
  vip_senders: []          # exact addresses; importance floor 2, skips the model for junk/mute
  vip_domains: []
  mute_senders: []         # tagged junk without a model call
  topics: []               # free-text hints folded into the tagging prompt
  max_needs_you: 5         # hard cap on the digest's "Needs you" section
  body_chars_for_model: 4000
