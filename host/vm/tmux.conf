# tmux for the assistant session: `ssh -t <host> tmux new -A -s assistant claude`
# (attaches if it exists, otherwise starts Claude in it). Detach: Ctrl-b d. Claude keeps running.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g set-clipboard on
set -s escape-time 10
