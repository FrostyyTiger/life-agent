# Samba for the personal host (life-agent/host). Rendered by install.sh --system; @USER@/@HOME@ filled in.
# Tailnet-only: the LAN is refused. [data] refuses connections while the archive disk is absent.
[global]
   server string = personal
   server role = standalone server
   server min protocol = SMB3
   server smb encrypt = desired
   hosts allow = 100.64.0.0/10 fd7a:115c:a1e0::/48 127.0.0.1 ::1
   hosts deny = ALL
   map to guest = never
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   disable netbios = yes
   smb ports = 445
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[data]
   path = /data
   valid users = @USER@
   force user = @USER@
   read only = no
   root preexec = /usr/local/sbin/data-mounted
   root preexec close = yes

[scan]
   # Paperless-ngx consume folder (VM disk, no /data dependency).
   path = @HOME@/paperless/consume
   valid users = @USER@
   force user = @USER@
   read only = no
